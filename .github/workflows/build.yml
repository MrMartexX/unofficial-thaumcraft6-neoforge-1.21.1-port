name: Build NeoForge Port

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NeoForge module
        working-directory: 05_neoforge_port
        shell: pwsh
        run: |
          .\gradlew.bat build --no-daemon `
            -Dorg.gradle.java.installations.auto-download=false `
            -Dorg.gradle.java.installations.paths="$env:JAVA_HOME"

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-build-outputs
          path: |
            05_neoforge_port/build/libs/**
            05_neoforge_port/build/reports/**
            05_neoforge_port/build/test-results/**
