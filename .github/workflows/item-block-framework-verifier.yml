name: Item/block framework verifier

on:
  workflow_dispatch:
    inputs:
      fail_mode:
        description: Verifier FailMode to use for manual runs
        required: true
        type: choice
        default: off
        options:
          - off
          - safe
          - strict
      full_audit:
        description: Run the full report-only audit before verifier checks
        required: true
        type: boolean
        default: true
      policy_mode:
        description: CI policy mode. report_only is default; strict is manual opt-in.
        required: true
        type: choice
        default: report_only
        options:
          - report_only
          - safe
          - strict
  pull_request:
    paths:
      - '.github/workflows/item-block-framework-verifier.yml'
      - '06_docs/audits/**'
      - 'tools/audits/item-block-parity/**'
      - '05_neoforge_port/src/main/resources/**'
      - '05_neoforge_port/src/main/java/**'
      - '05_neoforge_port/build.gradle'
      - '05_neoforge_port/gradle.properties'
      - '05_neoforge_port/settings.gradle'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/item-block-framework-verifier.yml'
      - '06_docs/audits/**'
      - 'tools/audits/item-block-parity/**'
      - '05_neoforge_port/src/main/resources/**'
      - '05_neoforge_port/src/main/java/**'
      - '05_neoforge_port/build.gradle'
      - '05_neoforge_port/gradle.properties'
      - '05_neoforge_port/settings.gradle'

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  verifier:
    name: Framework verifier (${{ github.event_name }})
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run framework verifier v2
        run: |
          $policyMode = 'report_only'
          $fullAudit = 'true'
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $inputPolicyMode = '${{ inputs.policy_mode }}'
            $inputFullAudit = '${{ inputs.full_audit }}'
            if (-not [string]::IsNullOrWhiteSpace($inputPolicyMode)) { $policyMode = $inputPolicyMode }
            if (-not [string]::IsNullOrWhiteSpace($inputFullAudit)) { $fullAudit = $inputFullAudit }
          }

          switch ($policyMode) {
            'report_only' { $failMode = 'off' }
            'safe' { $failMode = 'safe' }
            'strict' { $failMode = 'strict' }
            default { throw "Unknown policy_mode: $policyMode" }
          }
          Write-Host "CI policy mode: $policyMode; verifier FailMode: $failMode; fullAudit: $fullAudit"

          $verifierArgs = @(
            '-NoProfile',
            '-File', 'tools/audits/item-block-parity/verify-item-block-parity-framework.ps1',
            '-RepoRoot', (Get-Location).Path,
            '-FailMode', $failMode
          )
          if ($fullAudit -eq 'true') { $verifierArgs += '-FullAudit' }

          & pwsh @verifierArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload item/block parity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item-block-parity-framework-reports-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            tools/reports/local/item-block-parity/*.json
            tools/reports/local/item-block-parity/*.md
            tools/reports/local/item-block-parity/runtime-logs/**
