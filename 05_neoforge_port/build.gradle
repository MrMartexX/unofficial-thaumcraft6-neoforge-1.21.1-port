plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel'
    exclude 'src/generated/**/.cache'
}

repositories {
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
            )
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            def aspectDumpEnabled = providers.gradleProperty('tcAspectDump').orNull ?: System.getProperty('tc.aspectDump')
            def aspectDumpPath = providers.gradleProperty('tcAspectDumpPath').orNull ?: System.getProperty('tc.aspectDumpPath')
            def scanDumpEnabled = providers.gradleProperty('tcScanDump').orNull ?: System.getProperty('tc.scanDump')
            def scanDumpPath = providers.gradleProperty('tcScanDumpPath').orNull ?: System.getProperty('tc.scanDumpPath')
            def scanEntityDumpEnabled = providers.gradleProperty('tcScanEntityDump').orNull ?: System.getProperty('tc.scanEntityDump')
            def scanEntityDumpPath = providers.gradleProperty('tcScanEntityDumpPath').orNull ?: System.getProperty('tc.scanEntityDumpPath')
            def researchRequirementAuditEnabled = providers.gradleProperty('tcResearchRequirementAudit').orNull ?: System.getProperty('tc.researchRequirementAudit')
            def researchRequirementAuditPath = providers.gradleProperty('tcResearchRequirementAuditPath').orNull ?: System.getProperty('tc.researchRequirementAuditPath')
            def researchRequirementAuditDetailLimit = providers.gradleProperty('tcResearchRequirementAuditDetailLimit').orNull ?: System.getProperty('tc.researchRequirementAuditDetailLimit')
            def researchDataAuditEnabled = providers.gradleProperty('tcResearchDataAudit').orNull ?: System.getProperty('tc.researchDataAudit')
            def researchDataAuditPath = providers.gradleProperty('tcResearchDataAuditPath').orNull ?: System.getProperty('tc.researchDataAuditPath')
            def researchTableAuditEnabled = providers.gradleProperty('tcResearchTableAudit').orNull ?: System.getProperty('tc.researchTableAudit')
            def researchTableAuditPath = providers.gradleProperty('tcResearchTableAuditPath').orNull ?: System.getProperty('tc.researchTableAuditPath')
            if (aspectDumpEnabled != null) {
                systemProperty 'tc.aspectDump', aspectDumpEnabled
            }
            if (aspectDumpPath != null) {
                systemProperty 'tc.aspectDumpPath', aspectDumpPath
            }
            if (scanDumpEnabled != null) {
                systemProperty 'tc.scanDump', scanDumpEnabled
            }
            if (scanDumpPath != null) {
                systemProperty 'tc.scanDumpPath', scanDumpPath
            }
            if (scanEntityDumpEnabled != null) {
                systemProperty 'tc.scanEntityDump', scanEntityDumpEnabled
            }
            if (scanEntityDumpPath != null) {
                systemProperty 'tc.scanEntityDumpPath', scanEntityDumpPath
            }
            if (researchRequirementAuditEnabled != null) {
                systemProperty 'tc.researchRequirementAudit', researchRequirementAuditEnabled
            }
            if (researchRequirementAuditPath != null) {
                systemProperty 'tc.researchRequirementAuditPath', researchRequirementAuditPath
            }
            if (researchRequirementAuditDetailLimit != null) {
                systemProperty 'tc.researchRequirementAuditDetailLimit', researchRequirementAuditDetailLimit
            }
            if (researchDataAuditEnabled != null) {
                systemProperty 'tc.researchDataAudit', researchDataAuditEnabled
            }
            if (researchDataAuditPath != null) {
                systemProperty 'tc.researchDataAuditPath', researchDataAuditPath
            }
            if (researchTableAuditEnabled != null) {
                systemProperty 'tc.researchTableAudit', researchTableAuditEnabled
            }
            if (researchTableAuditPath != null) {
                systemProperty 'tc.researchTableAuditPath', researchTableAuditPath
            }
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
