            def scanEntityDumpPath = providers.gradleProperty('tcScanEntityDumpPath').orNull ?: System.getProperty('tc.scanEntityDumpPath')
            def researchRequirementAuditEnabled = providers.gradleProperty('tcResearchRequirementAudit').orNull ?: System.getProperty('tc.researchRequirementAudit')
            def researchRequirementAuditPath = providers.gradleProperty('tcResearchRequirementAuditPath').orNull ?: System.getProperty('tc.researchRequirementAuditPath')
            def researchRequirementAuditDetailLimit = providers.gradleProperty('tcResearchRequirementAuditDetailLimit').orNull ?: System.getProperty('tc.researchRequirementAuditDetailLimit')
            def researchDataAuditEnabled = providers.gradleProperty('tcResearchDataAudit').orNull ?: System.getProperty('tc.researchDataAudit')
            def researchDataAuditPath = providers.gradleProperty('tcResearchDataAuditPath').orNull ?: System.getProperty('tc.researchDataAuditPath')
